<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="RTT — real-time meeting transcriber">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g fill="url(#wave)" transform="translate(70,150)">
    <rect x="0"   y="-20" width="10" height="40" rx="5"><animate attributeName="height" values="40;90;30;60;40" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="-20;-45;-15;-30;-20" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="22"  y="-40" width="10" height="80" rx="5"><animate attributeName="height" values="80;30;100;50;80" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-40;-15;-50;-25;-40" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="44"  y="-55" width="10" height="110" rx="5"><animate attributeName="height" values="110;60;40;120;110" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="-55;-30;-20;-60;-55" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="66"  y="-30" width="10" height="60" rx="5"><animate attributeName="height" values="60;100;50;30;60" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-30;-50;-25;-15;-30" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="88"  y="-45" width="10" height="90" rx="5"><animate attributeName="height" values="90;40;70;110;90" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-45;-20;-35;-55;-45" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="110" y="-15" width="10" height="30" rx="5"><animate attributeName="height" values="30;70;90;40;30" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-35;-45;-20;-15" dur="1.7s" repeatCount="indefinite"/></rect>
  </g>
  <text x="240" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="64" font-weight="700" fill="#f8fafc">rtt</text>
  <text x="240" y="180" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#cbd5e1">Real-time meeting transcriber with stable speaker names</text>
  <text x="240" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#94a3b8">[10:02:14] <tspan fill="#22d3ee">Maya:</tspan> Can you have that by Friday?   <tspan fill="#fb923c">Daniel:</tspan> Yes, Friday works.</text>
</svg>
